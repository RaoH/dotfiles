source-file ~/.config/tmux/tmux.reset.conf
# Use nushell for interactive shells, zsh for tmux internals
#set-option -g default-command "/opt/homebrew/bin/nu"
set-option -g default-command "/bin/zsh"
set-option -g default-shell "/bin/zsh"
set-option -g default-terminal "${TERM}"
set-option -g terminal-overrides ',xterm-256color:RGB'

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit
bind -r t display-popup -d '#{pane_current_path}' -w80% -h80% -E btop 

# Custom session switcher (replaces tmux-sessionx)
bind-key o display-popup -B -h 30% -w 30% -E "~/.config/tmux/plugins/custom/session-switcher.sh"

# Opencode popup - creates/attaches to opencode session for current directory
bind-key c if-shell -F '#{m:claude-*,#{session_name}}' { detach-client } { run-shell 'CWD="#{?@nvim_cwd,#{@nvim_cwd},#{pane_current_path}}"; SESSION="claude-$(echo -n "$CWD" | md5 | cut -c1-8)"; tmux has-session -t "$SESSION" 2>/dev/null || tmux new-session -d -s "$SESSION" -c "$CWD" "claude; echo Press enter to restart or Ctrl-d to exit; read && exec claude"; tmux display-popup -w90% -h90% -E "TMUX= tmux attach-session -t $SESSION; true"' }
bind-key p if-shell -F '#{m:opencode-*,#{session_name}}' { detach-client } { run-shell 'CWD="#{?@nvim_cwd,#{@nvim_cwd},#{pane_current_path}}"; SESSION="opencode-$(echo -n "$CWD" | md5 | cut -c1-8)"; tmux has-session -t "$SESSION" 2>/dev/null || tmux new-session -d -s "$SESSION" -c "$CWD" "opencode; echo Press enter to restart or Ctrl-d to exit; read && exec opencode"; tmux display-popup -w90% -h90% -E "TMUX= tmux attach-session -t $SESSION; true"' }

# Common keybind

## Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5
bind-key -n C-t set-option -g status

# Creates a floating window that is persisted
bind-key -n M-f if-shell -F '#{==:#{session_name},floating}' {
    detach-client
} {
    display-popup -w 80% -h 60% -x C -y C "tmux new-session -A -s floating"
}

## Hide and show pane
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.0

setw -g aggressive-resize on

# Plugin options (set before loading plugins)
set -g @fzf-url-fzf-options '--tmux 60%,30% --prompt=" " --border-label="Open URL" --multi --exit-0'
set -g @fzf-url-history-limit '2000'
set -g @resurrect-strategy-nvim 'session'

# ===== Catppuccin v2 Configuration =====
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato, or mocha

set -g status-right-length 100
set -g status-left-length 100

set -g @catppuccin_window_status_style "rounded"

# Status modules: session + application on the left, nothing on the right
set -g @catppuccin_status_modules_left "session application"
set -g @catppuccin_status_modules_right "null"

# ===== Plugins (managed by TPM) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# NOTE: Removed plugins:
# - tmux-continuum: causes constant CPU usage via status-right polling
# - tmux-sessionx: replaced by custom session-switcher.sh

# Initialize TPM (must be last). On a new machine: prefix + I to install plugins.
run '~/.config/tmux/plugins/tpm/tpm'
